name: CI

on:
  pull_request:
    branches: [main, local-dev]
  push:
    branches: [main, local-dev]

permissions:
  contents: read

jobs:
  coordinator-and-plugin:
    runs-on: windows-latest
    env:
      FranthropySource: Local
      FranthropyRoot: ${{ github.workspace }}/Franthropy
    steps:
      - uses: actions/checkout@v6
        with:
          path: SapphireAvenueAssistant
      - name: Read pinned Franthropy revision
        id: franthropy
        shell: pwsh
        run: |
          [xml]$pin = Get-Content SapphireAvenueAssistant/eng/Franthropy.Version.props
          $revision = ([string]$pin.Project.PropertyGroup.FranthropyPackageVersion).Replace('0.1.0-commit.', '')
          if ($revision -notmatch '^[0-9a-f]{40}$') { throw 'Invalid Franthropy package pin.' }
          "revision=$revision" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v6
        with:
          repository: FranFkntastic/Franthropy
          ref: ${{ steps.franthropy.outputs.revision }}
          path: Franthropy
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.301

      - name: Install Dalamud reference assemblies
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'dalamud-latest.zip'
          $dalamudRoot = Join-Path $env:APPDATA 'XIVLauncher\addon\Hooks\dev'
          Invoke-WebRequest 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile $archive
          Expand-Archive $archive -DestinationPath $dalamudRoot
          if (-not (Test-Path (Join-Path $dalamudRoot 'Dalamud.dll'))) {
            throw 'Dalamud reference bundle is incomplete.'
          }

      - name: Test coordinator boundaries
        working-directory: SapphireAvenueAssistant
        run: dotnet test tests/SapphireAvenueAssistant.Tests/SapphireAvenueAssistant.Tests.csproj -c Release

      - name: Build Dalamud plugin
        working-directory: SapphireAvenueAssistant
        shell: pwsh
        run: >-
          dotnet build src/SapphireAvenueRelay/SapphireAvenueRelay.csproj
          -c Release -p:Platform=x64
          -p:FranthropyRoot="$env:GITHUB_WORKSPACE\Franthropy"
